name: Update purchase box status

on:
  push:
    paths:
      - ".github/workflows/update-purchase-box-status.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply beta4 patch
        run: |
          python tools/patch_beta4.py
          python tools/fix_beta4_test.py

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile and test
        run: |
          python -m py_compile run_scan.py src/*.py tests/test_utils.py
          PYTHONPATH=. pytest -q

      - name: Commit tested update
        run: |
          rm -f tools/patch_beta4.py tools/fix_beta4_test.py
          rm -f .github/workflows/update-purchase-box-status.yml
          git config user.name "water3ovo"
          git config user.email "1367804732@qq.com"
          git add -A
          git commit -m "Add robust purchase box status classification"
          git push
