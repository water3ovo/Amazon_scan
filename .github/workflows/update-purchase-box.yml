name: Update purchase box parsing

on:
  push:
    paths:
      - ".github/workflows/update-purchase-box.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply purchase box update
        run: |
          python -c "import base64,gzip;open('/tmp/patch.py','wb').write(gzip.decompress(base64.b64decode('')))"
          python /tmp/patch.py

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile and test
        run: |
          python -m py_compile run_scan.py src/*.py tests/test_utils.py
          pytest -q

      - name: Commit tested update
        run: |
          rm -f .github/workflows/update-purchase-box.yml
          git config user.name "water3ovo"
          git config user.email "1367804732@qq.com"
          git add -A
          git commit -m "Fix AE SA purchase box owner parsing"
          git push
