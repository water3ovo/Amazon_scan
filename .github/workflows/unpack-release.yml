name: Import Amazon Scan V2 source

on:
  push:
    branches: [main]
    paths:
      - 'Amazon_Scan_V2_beta2_fixed.zip'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack release source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .unpack
          mkdir -p .unpack
          unzip -q Amazon_Scan_V2_beta2_fixed.zip -d .unpack
          cp -a .unpack/amazon_scan_v2/. .
          rm -rf .unpack
          rm -rf src/__pycache__
          cp README_使用说明.md README.md

      - name: Commit source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import Amazon Scan V2 beta2 source'
          git push
